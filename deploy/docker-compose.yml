services:
  babytrack-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: babytrack_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - TZ=America/Mexico_City
      - DATA_DIR=/app/data
      - DATABASE_URL=sqlite:////app/data/babytrack.db
      - DEFAULT_DUE_DATE=2027-07-07
      - FAMILY_ACCESS_PIN=0707
    volumes:
      - ../data:/app/data
      - ../app:/app/app
